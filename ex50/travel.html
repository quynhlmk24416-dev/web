<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Travel Expense Report</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: 30px;
                font-family: "Times New Roman", serif;
                background-color: white;
            }
            .form-container {
                width: 1050px;
                min-height: 900px;
                margin: auto;
                background-color: #c8ffff;
                border-left: 5px solid blue;
                border-right: 2px solid #999;
                padding: 15px 20px 20px;
            }
            .logo {
                text-align: center;
                margin-bottom: 30px;
            }
            .logo img {
                width: 650px;
                height: auto;
            }
            h2 {
                font-size: 30px;
                margin: 15px 0 25px;
            }
            hr {
                border: none;
                border-top: 2px solid #777;
                margin-bottom: 24px;
            }
            .form-row {
                margin-bottom: 18px;
                font-size: 20px;
            }
            label {
                vertical-align: middle;
            }
            input[type="text"],
            input[type="date"],
            select,
            textarea {
                font-family: "Times New Roman", serif;
                font-size: 18px;
                border: 1px solid #8499b7;
                background: white;
                padding: 4px 6px;
            }
            .name-input {
                width: 175px;
                height: 32px;
            }
            .ssn-input {
                width: 120px;
                height: 32px;
            }
            .department-select {
                width: 135px;
                height: 32px;
            }
            textarea {
                display: block;
                width: 640px;
                height: 100px;
                resize: none;
                margin-top: 20px;
            }
            /* Expense table */
            .expense-section {
                margin-top: 25px;
            }
            .expense-title {
                font-size: 20px;
                margin-bottom: 20px;
            }
            table {
                border-collapse: collapse;
                width: 840px;
                background-color: transparent;
            }
            th,
            td {
                border: 2px solid #7f9494;
                padding: 4px;
            }
            th {
                font-size: 20px;
                background-color: #d9ffff;
                text-align: center;
            }
            td input,
            td select {
                width: 100%;
                height: 30px;
            }
            .date-col {
                width: 130px;
            }
            .description-col {
                width: 430px;
            }
            .category-col {
                width: 170px;
            }
            .amount-col {
                width: 110px;
            }
            .receipt-row {
                margin-top: 28px;
                font-size: 20px;
            }
            .receipt-row input[type="radio"] {
                width: 18px;
                height: 18px;
                margin-left: 12px;
                cursor: pointer;
            }
            .button-row {
                margin-top: 25px;
            }
            button {
                font-family: Arial, sans-serif;
                font-size: 16px;
                padding: 6px 16px;
                margin-right: 5px;
                border: 1px solid #555;
                border-radius: 4px;
                background: linear-gradient(#ffffff, #d4d4d4);
                cursor: pointer;
            }
            button:hover {
                background: #e5e5e5;
            }
            button:active {
                transform: translateY(1px);
            }
            .contact {
                margin-top: 25px;
                font-size: 19px;
            }
            @media (max-width: 1100px) {
                .form-container {
                    width: 100%;
                }
                .logo {
                    width: 70%;
                }
                table {
                    width: 100%;
                }
                textarea {
                    width: 65%;
                }
            }
        </style>
    </head>
    <body>
        <div class="form-container">
            <div class="logo">
                <img src="DeLong.jpg" alt="DeLong Enterprises">
            </div>
            <h2>Travel Expense Report</h2>
            <hr>
            <form id="expenseForm">
                <div class="form-row">
                    <label>
                        1) First Name:
                        <input
                            type="text"
                            id="firstName"
                            class="name-input"
                        >
                    </label>
                    <label>
                        Last Name:
                        <input
                            type="text"
                            id="lastName"
                            class="name-input"
                        >
                    </label>
                </div>
                <div class="form-row">
                    <label>
                        2) Social Security Number:
                        <input
                            type="text"
                            id="ssn"
                            class="ssn-input"
                        >
                    </label>
                </div>
                <div class="form-row">
                    <label>
                        3) Department:
                        <select id="department" class="department-select">
                            <option value="Accounting">Accounting</option>
                            <option value="Sales">Sales</option>
                            <option value="Marketing">Marketing</option>
                            <option value="IT">IT</option>
                            <option value="Human Resources">
                                Human Resources
                            </option>
                        </select>
                    </label>
                </div>
                <div class="form-row">
                    <label for="purpose">
                        4) Describe the purpose of your trip.
                    </label>
                    <textarea id="purpose"></textarea>
                </div>
                <div class="expense-section">
                    <div class="expense-title">
                        5) Itemize your travel expenses
                    </div>
                    <table>
                        <thead>
                        <tr>
                            <th class="date-col">Date</th>
                            <th class="description-col">Description</th>
                            <th class="category-col">Category</th>
                            <th class="amount-col">Amount</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td>
                                <input
                                    type="text"
                                    class="expense-date"
                                    placeholder="mm/dd/yy"
                                >
                            </td>
                            <td>
                                <input
                                    type="text"
                                    class="expense-description"
                                >
                            </td>
                            <td>
                                <select class="expense-category">
                                    <option value="Meal">Meal</option>
                                    <option value="Hotel">Hotel</option>
                                    <option value="Transportation">
                                        Transportation
                                    </option>
                                    <option value="Airfare">Airfare</option>
                                    <option value="Other">Other</option>
                                </select>
                            </td>
                            <td>
                                <input
                                    type="text"
                                    class="expense-amount"
                                >
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <input
                                    type="text"
                                    class="expense-date"
                                    placeholder="mm/dd/yy"
                                >
                            </td>
                            <td>
                                <input
                                    type="text"
                                    class="expense-description"
                                >
                            </td>
                            <td>
                                <select class="expense-category">
                                    <option value="Meal">Meal</option>
                                    <option value="Hotel">Hotel</option>
                                    <option value="Transportation">
                                        Transportation
                                    </option>
                                    <option value="Airfare">Airfare</option>
                                    <option value="Other">Other</option>
                                </select>
                            </td>
                            <td>
                                <input
                                    type="text"
                                    class="expense-amount"
                                >
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <input
                                    type="text"
                                    class="expense-date"
                                    placeholder="mm/dd/yy"
                                >
                            </td>
                            <td>
                                <input
                                    type="text"
                                    class="expense-description"
                                >
                            </td>
                            <td>
                                <select class="expense-category">
                                    <option value="Meal">Meal</option>
                                    <option value="Hotel">Hotel</option>
                                    <option value="Transportation">
                                        Transportation
                                    </option>
                                    <option value="Airfare">Airfare</option>
                                    <option value="Other">Other</option>
                                </select>
                            </td>
                            <td>
                                <input
                                    type="text"
                                    class="expense-amount"
                                >
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <input
                                    type="text"
                                    class="expense-date"
                                    placeholder="mm/dd/yy"
                                >
                            </td>
                            <td>
                                <input
                                    type="text"
                                    class="expense-description"
                                >
                            </td>
                            <td>
                                <select class="expense-category">
                                    <option value="Meal">Meal</option>
                                    <option value="Hotel">Hotel</option>
                                    <option value="Transportation">
                                        Transportation
                                    </option>
                                    <option value="Airfare">Airfare</option>
                                    <option value="Other">Other</option>
                                </select>
                            </td>
                            <td>
                                <input
                                    type="text"
                                    class="expense-amount"
                                >
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="receipt-row">
                    6) Have you submitted your receipts?
                    <label>
                        <input
                            type="radio"
                            name="receipt"
                            value="Yes"
                        >
                        Yes
                    </label>
                    <label>
                        <input
                            type="radio"
                            name="receipt"
                            value="No"
                        >
                        No
                    </label>
                </div>
                <div class="button-row">
                    <button type="submit">
                        Submit travel expenses
                    </button>
                    <button type="reset">
                        Reset
                    </button>
                </div>
                <div class="contact">
                    Questions? Contact Debbie Larson in Accounting (ext. 2150).
                </div>
            </form>
        </div>
        <script>
            const form = document.getElementById("expenseForm");
            form.addEventListener("submit", function(event) {
                event.preventDefault();
                const firstName =
                    document.getElementById("firstName").value;
                const lastName =
                    document.getElementById("lastName").value;
                /*Nếu người dùng nhập họ tên thì thông báo kèm theo tên.*/
                if (firstName !== "" || lastName !== "") {
                    alert(
                        "Submit thành công!\n" +
                        "Travel Expense Report của " +
                        firstName + " " + lastName +
                        " đã được gửi."
                    );
                } else {
                    alert("Submit thành công!");
                }
            });
            form.addEventListener("reset", function() {
                /*Sau khi nhấn Reset, trình duyệt tự động đưa form về giá trị ban đầu.*/
                setTimeout(function() {
                    alert("Form đã được reset!");
                }, 50);
            });
        </script>
    </body>
</html>
